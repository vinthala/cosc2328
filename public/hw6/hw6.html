     <!DOCTYPE html>
     <html lang="en">
        <head>
            <meta charset="UTF-8">
            <title>HW6 - Interactive Product Calculator</title>
            <link rel="stylesheet" href="css/hw6.css">
            <script defer src="js/hw6-script.js"></script>
        </head>
        <body>
            <header class="site-header">
                <h1>Product Order Calculator</h1>
                </header>
                <main class="container">
                    <form id="orderForm">
                        <fieldset>
                            <legend>Order Details</legend>
                                <select id="product" label="products">
                                    <optgroup>
                                        <option value="" disabled selected placeholder>Pick a product</option>
                                        <option value="laptop">laptop</option>
                                        <option value="tablet">tablet</option>
                                        <option value="phone">phone</option>
                                        <option value="monitor">monitor</option>
                                        </optgroup>
                                </select>

                    <!-- I changed this to min="0" from min="1" in the instructions because it does not allow the alert for a quantity of 0 to show 6.7 instructions-->
                                <input type="number" id="quantity" min="0" max="10" value="1" label="quantity">
                                <input type="text" id="discountCode" label="discount Code">
                                <button type="submit" label="submit button">Calculate Total</button>
                        </fieldset>
                    </form>
                    <div id="results" class="results-hidden">
                        <ul >
                            <li id="productText"></li>
                            <li id="numProducts"></li>
                            <li id="actualSubtotal"></li>
                            <li id="discountAmount"></li>
                            <li id="tax"></li>
                            <li id="total"></li>
                        </ul>
                    </div>
                    <footer class="site-footer">Name: Val Inthalangsy Course: COSC2328 with Dr. McCurry</footer>
                    <noscript><div class="alert">Enable JavaScript to view interactive content.</div></noscript>
                </main>
        </body>

     </html>
